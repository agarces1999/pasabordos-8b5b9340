<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="robots" content="noindex, nofollow">
<title>Pasabordos Nosotros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --navy: #16233F;
    --navy-2: #1E3054;
    --gold: #C8A24A;
    --cream: #F2ECE0;
    --paper: #FBF7EE;
    --ink: #16233F;
    --soft: #6B7794;
    --rule: #C9CEDA;
    --red: #A8322B;
    --bg: #E7E1D4;
    --mono: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #131B2C; --paper: #1A2438; --ink: #E8EAF0; --soft: #96A1B8;
      --rule: #33405C; --bg: #0D131F; --gold: #D9B564;
    }
  }
  :root[data-theme="dark"] {
    --cream: #131B2C; --paper: #1A2438; --ink: #E8EAF0; --soft: #96A1B8;
    --rule: #33405C; --bg: #0D131F; --gold: #D9B564;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 24px 56px;
  }
  .wrap { max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
  .wrap.todos { max-width: 520px; }

  /* ---- pasabordo ---- */
  .pase {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    overflow: hidden; box-shadow: 0 18px 40px -26px rgba(22,35,63,.65);
  }
  .top {
    background: var(--navy); color: var(--gold);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px;
  }
  .marca { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: .22em; font-size: 12px; }
  .marca svg { width: 22px; height: 22px; display: block; }
  .top .cls { font-size: 10px; letter-spacing: .2em; opacity: .85; text-align: right; }

  .ruta { padding: 22px 18px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .iata { font-family: var(--sans); font-weight: 700; font-size: clamp(34px, 12vw, 46px); line-height: .9; letter-spacing: -.02em; }
  .ciudad { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--soft); margin-top: 6px; }
  .ruta .fin { text-align: right; }
  .avion { color: var(--gold); }
  .avion svg { width: 30px; height: 30px; display: block; }

  .rejilla { padding: 4px 18px 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
  .rejilla.dos { grid-template-columns: repeat(2, 1fr); }
  .lab { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  .val { font-size: 15px; font-weight: 500; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .val.sm { font-size: 12.5px; }

  .perf { position: relative; border-top: 1px dashed var(--rule); margin: 0 0 0; }
  .perf::before, .perf::after {
    content: ""; position: absolute; top: -11px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--bg);
  }
  .perf::before { left: -11px; } .perf::after { right: -11px; }

  .pie { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .barras { height: 48px; display: flex; gap: 2px; align-items: stretch; }
  .barras i { flex: 1; background: var(--ink); border-radius: .5px; }
  .loc { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .loc .code { font-size: 17px; letter-spacing: .26em; font-weight: 600; }
  .nota { font-size: 12.5px; color: var(--soft); line-height: 1.55; }
  .sello {
    align-self: flex-start; border: 1.5px solid var(--red); color: var(--red); border-radius: 5px;
    padding: 5px 10px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    transform: rotate(-3deg);
  }

  /* ---- encabezado y lista ---- */
  .cab { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .cab h1 { font-family: var(--sans); font-size: 21px; font-weight: 700; letter-spacing: .04em; margin: 0; }
  .cab p { margin: 0; font-size: 13px; color: var(--soft); }
  .volver { display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); text-align: center; text-decoration: none; }
  .volver:hover, .volver:focus-visible { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  a.tarjeta { text-decoration: none; color: inherit; display: block; }
  a.tarjeta:hover .pase { box-shadow: 0 22px 46px -24px rgba(22,35,63,.7); }
  @media (prefers-reduced-motion: no-preference) { .pase { transition: box-shadow .2s ease; } }
</style>

</head>

const AVION = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15.5v-1.7l-7.5-4.3V4.3c0-.9-.7-1.6-1.5-1.6s-1.5.7-1.5 1.6v5.2L3 13.8v1.7l7.5-2.2v4.6l-2 1.4v1.3l3.5-1 3.5 1v-1.3l-2-1.4v-4.6l7.5 2.2Z"/></svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* barras de código, deterministas por clave */
function barras(clave) {
  let h = 0;
  for (const ch of clave) h = (h * 31 + ch.charCodeAt(0)) % 100000;
  let out = "";
  for (let i = 0; i < 46; i++) {
    h = (h * 1103515245 + 12345) % 2147483648;
    const w = (h % 4) + 1;
    out += `<i style="flex:${w};opacity:${(h % 3) ? 1 : 0.12}"></i>`;
  }
  return out;
}

function localizador(clave) {
  const base = "NS" + clave.slice(0, 2).toUpperCase();
  let h = 7;
  for (const ch of clave) h = (h * 33 + ch.charCodeAt(0)) % 46656;
  return base + h.toString(36).toUpperCase().padStart(3, "0");
}

function pase(clave, v) {
  const nom = PASAJERA || "&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;";
  return `
  <article class="pase">
    <div class="top">
      <span class="marca">${LOGO} NOSOTROS</span>
      <span class="cls">${esc(v.clase)}<br>PASE DE ABORDAJE</span>
    </div>
    <div class="ruta">
      <div><div class="iata">${esc(ORIGEN.iata)}</div><div class="ciudad">${esc(ORIGEN.ciudad)}</div></div>
      <div class="avion">${AVION}</div>
      <div class="fin"><div class="iata">${esc(v.destino.iata)}</div><div class="ciudad">${esc(v.destino.ciudad)}</div></div>
    </div>
    <div class="rejilla dos">
      <div><div class="lab">Pasajera / Passenger</div><div class="val sm">${nom}</div></div>
      <div><div class="lab">Motivo del viaje</div><div class="val sm">${esc(v.cuando)}</div></div>
    </div>
    <div class="rejilla">
      <div><div class="lab">Vuelo</div><div class="val">${esc(v.vuelo)}</div></div>
      <div><div class="lab">Fecha</div><div class="val">${esc(v.fecha)}</div></div>
      <div><div class="lab">Puerta</div><div class="val">${esc(v.puerta)}</div></div>
      <div><div class="lab">Asiento</div><div class="val">${esc(v.asiento)}</div></div>
      <div><div class="lab">Grupo</div><div class="val">${esc(v.grupo)}</div></div>
      <div><div class="lab">Embarque</div><div class="val sm">${esc(v.embarque)}</div></div>
    </div>
    <div class="rejilla dos">
      <div><div class="lab">Operado por</div><div class="val sm">${esc(v.operador)}</div></div>
      <div><div class="lab">Escalas</div><div class="val sm">${esc(v.escala)}</div></div>
    </div>
    <div class="perf"></div>
    <div class="pie">
      <div class="barras">${barras(clave)}</div>
      <div class="loc"><span class="lab">Localizador</span><span class="code">${localizador(clave)}</span></div>
      <p class="nota">${esc(v.nota)}</p>
      <span class="sello">Confirmado · no vence</span>
    </div>
  </article>`;
}

function render() {
  const clave = location.hash.replace("#", "").toLowerCase();
  const app = document.getElementById("app");
  if (VIAJES[clave]) {
    app.className = "wrap";
    app.innerHTML = pase(clave, VIAJES[clave]) + `<a class="volver" href="#">Ver los cuatro pasabordos</a>`;
  } else {
    app.className = "wrap todos";
    app.innerHTML = `
      <div class="cab">
        <h1>Aerolínea Nosotros</h1>
        <p>Cuatro pasabordos abiertos. Tú eliges cuál usamos primero.</p>
      </div>` + ORDEN.map(k => `<a class="tarjeta" href="#${k}">${pase(k, VIAJES[k])}</a>`).join("");
  }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
